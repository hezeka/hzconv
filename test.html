<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вайфукардс оффлайн</title>
<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	body {
		background-color: #18191A;
		color: white;
		font-family: 'Rubik', sans-serif;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 1rem;
	}

	.card {
		width: 100%;
		max-width: 320px;
		padding: 1.5rem;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 1.5rem;
		justify-content: space-between;
		height: 100vh;
		min-height: 600px;
		max-height: 760px;
		padding: 56px 16px;
	}

	.logo {
		width: 164px;
		height: 102px;
		transition: transform 0.3s;
		background-position: center;
		background-size: contain;
		background-repeat: no-repeat;
	}

	.logo:hover {
		transform: scale(1.05);
	}

	.waifuchan {
		width: 214px;
		height: 214px;
		transition: all 0.3s;
		animation: shake 3s infinite;
		transform-origin: center bottom;
		cursor: pointer;
		user-select: none;
		-webkit-tap-highlight-color: transparent;
		-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
	}

	.waifuchan:hover {
		transform: scale(1.05);
		filter: brightness(1.12);
	}

	.status {
		display: flex;
		align-items: center;
		gap: 5px;
		font-size: 16px;
		flex-direction: column;
		position: relative;
	}

	.status-dot {
		width: 10px;
		height: 10px;
		background-color: #ef4444;
		border-radius: 50%;
		animation: pulse 2s infinite;
		position: absolute;
		right: calc(100% + 12px);
		transition: .2s;
	}

	.status-dot.online {
		background-color: #40b16b;
		animation: none;
	}

	.status-badge {
		display: flex;
		align-items: center;
		gap: 12px;
		font-size: 24px;
		font-weight: bold;
	}

	.buttons {
		display: flex;
		align-items: center;
		gap: 16px;
	}

	.button {
		padding: 16px 24px;
		padding-left: 20px;
		background-color: #5F51B9;
		background-image: linear-gradient(176deg, #8437c3 0%, #5f51b906 100%);
		color: white;
		border: none;
		border-radius: 12px;
		cursor: pointer;
		font-size: 14px;
		transition: all 0.3s;
		display: flex;
		align-items: center;
		font-weight: normal;
	}

	.button:hover {
		background-color: #7e22ce;
		box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
	}

	.button:active {
		background-color: #6b21a8;
	}

	.button.tg {
		padding: 16px;
		background-image: linear-gradient(176deg, #37b6c3 0%, #5f51b906 100%);
	}

	.refresh-icon {
		display: inline-block;
		width: 16px;
		height: 16px;
		background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABEAAAARCAYAAAA7bUf6AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAADeSURBVHgBpZMLEcIwDIZTFFTCJMzBcMAcbE4mAQnFwSQUFICDzcFwENJrc4TSW8rx3eV6l8ffrMkAFBCxJRvgH0jgjhEHv0JFlqwn8/imTogSm6wwZ9IERrJNFCzic5he64AJhV3yz8I/aF14IWAz/1Yj0IrbmkLc7tUf0tml82qMWfMk8j1rRPimFSpInY/cNYvwTQ3UcSYLO3OSykfxJlbpQk6xy4M8nVkRcbxDpaDsxuVTwvgbXNSlo8CEn/gkyLvCqKsfOlqwjP96B8LsiIXkFuL4w/QetC+3Uu4LOM91OOo+KXkAAAAASUVORK5CYII=');
		background-size: contain;
		background-repeat: no-repeat;
		margin-right: 12px;
	}

	.main-info {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 34px
	}

	@keyframes pulse {

		0%,
		100% {
			opacity: 1;
		}

		50% {
			opacity: 0.5;
		}
	}

	@keyframes shake {
		0% {
			transform: rotate(0deg) scaleY(1);
		}

		25% {
			transform: rotate(-.5deg) scaleY(1.02);
		}

		50% {
			transform: rotate(0deg) scaleY(1);
		}

		75% {
			transform: rotate(.5deg) scaleY(1.02);
		}

		100% {
			transform: rotate(0deg) scaleY(1);
		}
	}

	.square {
		transition: all 0.12s cubic-bezier(0.31, 0.1, 0.57, 1.14);
		-webkit-tap-highlight-color: transparent;
		-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
	}

	.squished {
		transform: scale(1.05, 0.90);
		/* Сплющивание по высоте */
		transform-origin: center bottom;
	}
</style>
</head>

	const texts = ['Обновить страницу', 'Проверить', 'Ещё раз проверить', 'Повторить попытку', 'Обновить', 'Ещё обновить', 'Проверить снова', 'Ещё раз попробовать']

	const btnText = document.getElementById('button-text');
	btnText.textContent = texts[Math.floor(Math.random() * texts.length)];
	
	const square = document.getElementById('square');
	const statusBadge = document.querySelector('.status-badge span:last-child');
	const statusDot = document.querySelector('.status-dot');

	square.addEventListener('click', () => {
			square.classList.add('squished'); // Добавляем/удаляем класс сплющивания
			setTimeout(()=> {
				square.classList.remove('squished');
			}, 100)
	});

	const domains = [
		{
			url: 'waifucards.app',
			status: null
		},
		{
			url: 'waifucards.org',
			status: null
		},
		{
			url: 'waifucards.ru',
			status: null
		}
	]

	const activeDomain = location.hostname;

	let counter = 0
	let lastCheck = 0;
	async function checkStatus(type) {
			if (document.hasFocus() && (statusBadge.textContent == 'Оффлайн' || type == 'auto')) {
					const now = Date.now();
					if (now - lastCheck > 5000) {
							lastCheck = now;
							try {
									for (const domain of domains) {
											fetch(`https://${domain.url}/check-status`, { mode: 'no-cors' })
											.then(response => {
												if (response.ok) {
													if (activeDomain == domain.url) {
														statusBadge.textContent = 'Онлайн';
														statusDot.classList.add('online');
														domain.status = true;
													} else {
														domain.status = true;
													}
												} else {
													if (activeDomain == domain.url) {
														statusBadge.textContent = 'Оффлайн';
														statusDot.classList.remove('online');
														domain.status = false;
													} else {
														domain.status = false;
													}
												}
											})
											.catch(error => {
												if (activeDomain == domain.url) {
													statusBadge.textContent = 'Оффлайн';
													statusDot.classList.remove('online');
													domain.status = false;
												} else {
													domain.status = false;
												}
											});
									}
									// const response = await fetch('/check-status');
									// if (response.ok) {
									// 		statusBadge.textContent = 'Онлайн';
									// 		statusDot.classList.add('online');
									// } else {
									// 		statusBadge.textContent = 'Оффлайн';
									// 		statusDot.classList.remove('online');
									// }
							} catch (error) {
									// statusBadge.textContent = 'Оффлайн';
									// statusDot.classList.remove('online');
							}
					} else {
						return
					}
			}
	}

	checkStatus()

	window.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'visible') {
					checkStatus()
			}
	});

	square.addEventListener('click', () => {
		checkStatus()

		counter++

		if (counter % 50 == 0) {
			document.getElementById('waifuchan').style.backgroundImage = `url(${waifuchans[Math.floor(Math.random() * waifuchans.length)]})`;
		}

		// if (counter % 1000 == 0) {
		// 	document.getElementById('waifuchan').style.backgroundImage = `url(${waifuchans[Math.floor(Math.random() * waifuchans.length)]})`;
		// }
	});

	setInterval(() => { checkStatus('auto') }, 60000);

</script>
